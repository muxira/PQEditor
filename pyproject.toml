[project]
name = "pqeditor"
version = "0.1.0"
description = "Standalone desktop pack editor for Party Quiz (.pq packs)"
readme = "FORMAT.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pqeditor = "pqeditor.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyinstaller]
# used by scripts/build.py if present
